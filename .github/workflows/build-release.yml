name: Build and Release App (APK & IPA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK'
        required: true
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA'
        required: true
        type: boolean
        default: true

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  version-bump:
    name: Bump Version
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore(release): bump version')
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      version_code: ${{ steps.bump.outputs.version_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump Version
        id: bump
        run: node app/scripts/bump-version.js

      - name: Commit and Push bumped version back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json app/app.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No version changes to commit."
          fi

  build-apk:
    name: Build Android APK
    needs: version-bump
    if: ${{ !cancelled() && (inputs.build_android == true || inputs.build_android == null) }}
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: https://bridges-nine.vercel.app

    steps:
      - name: Checkout repository (bumped commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prebuild Android project
        working-directory: app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android Release APK
        working-directory: app/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK for upload
        run: |
          mkdir -p app/build-output
          APK_PATH=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" "app/build-output/bridges-app-v${{ needs.version-bump.outputs.new_version }}.apk"
          else
            echo "Error: No APK file was generated." >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridges-app-android-v${{ needs.version-bump.outputs.new_version }}
          path: app/build-output/bridges-app-v${{ needs.version-bump.outputs.new_version }}.apk
          retention-days: 14

  build-ipa:
    name: Build iOS IPA
    needs: version-bump
    if: ${{ !cancelled() && (inputs.build_ios == true || inputs.build_ios == null) }}
    runs-on: macos-latest
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: https://bridges-nine.vercel.app
      CI: "true"
      CI_ALLOW_PROFILE_UPDATE: "true"
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPLE_TEAM_ID: "JR22X95AFT"

    steps:
      - name: Checkout repository (bumped commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up SSH Agent for certificates repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}

      - name: Clone certificates repository
        run: git clone git@github.com:Bridges-8103/bridges-certificates.git certificates

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Prebuild iOS project
        working-directory: app
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install

      - name: Build iOS IPA with Fastlane
        working-directory: app
        run: fastlane ios build_adhoc

      - name: Prepare IPA for upload
        run: |
          IPA_PATH=$(find app/build-output -name "*.ipa" | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            cp "$IPA_PATH" "app/build-output/bridges-app-v${{ needs.version-bump.outputs.new_version }}.ipa"
          else
            echo "Error: No IPA file was generated." >&2
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridges-app-ios-v${{ needs.version-bump.outputs.new_version }}
          path: app/build-output/bridges-app-v${{ needs.version-bump.outputs.new_version }}.ipa
          retention-days: 14

  publish-release:
    name: Publish Release (APK & IPA)
    needs: [version-bump, build-apk, build-ipa]
    if: always() && !cancelled() && needs.version-bump.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-bump.outputs.new_version }}
          name: Release v${{ needs.version-bump.outputs.new_version }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
